<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cobertura HDM · día × medio</title>
<style>
:root{--bg:#0B1C2C;--card:#12263A;--line:#1E3A54;--txt:#E8F1FA;--mute:#8AA0B8;--ok:#2ECC71;--zero:#C0392B;--hi:#1A4A6E}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
a{color:#7EC8FF;text-decoration:none}
.wrap{padding:14px 12px 40px;max-width:100%}
h1{font-size:1.15rem;margin:0 0 4px}
.sub{color:var(--mute);font-size:.85rem;margin:0 0 14px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.nav a,.nav button{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:10px;font-size:.85rem;cursor:pointer}
.nav button.activo{background:#1E5A8A;border-color:#2E7AB0}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--mute);margin:0 0 10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.dot.ok{background:var(--ok)}.dot.zero{background:var(--zero)}
.scroller{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);-webkit-overflow-scrolling:touch;max-height:78vh}
table{border-collapse:separate;border-spacing:0;min-width:100%;font-size:.78rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:#0F2A40;position:sticky;top:0;z-index:2;font-weight:650}
th.medio{writing-mode:horizontal-tb;max-width:72px;white-space:normal;line-height:1.15;font-size:.72rem}
th.sticky,td.sticky{position:sticky;left:0;z-index:1;background:#0F2A40;text-align:left;min-width:88px}
td.sticky{background:#152E44;font-variant-numeric:tabular-nums}
tr:hover td{background:var(--hi)}
tr:hover td.sticky{background:#1A3A55}
td.n{font-variant-numeric:tabular-nums;font-weight:650}
td.n.ok{color:var(--ok)}
td.n.zero{color:#E74C3C;opacity:.85}
td.total{font-weight:700;background:#0F2A40}
.foot{margin-top:12px;color:var(--mute);font-size:.78rem}
</style>
</head>

function fmt(f){ if(!f) return ""; const p=f.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function pintar(){
  const cols=DATA.cols, filas=DATA.filas;
  let h='<table><thead><tr><th class="sticky">Día</th>';
  cols.forEach(c=>{ h+='<th class="medio">'+c+'</th>'; });
  h+='<th>Total</th></tr></thead><tbody>';
  filas.forEach(fila=>{
    h+='<tr><td class="sticky">'+fmt(fila.f)+'</td>';
    fila.vals.forEach(n=>{
      const cls = n>0 ? 'n ok' : 'n zero';
      h+='<td class="'+cls+'">'+(n||'·')+'</td>';
    });
    h+='<td class="total">'+(fila.total||0)+'</td></tr>';
  });
  h+='</tbody></table>';
  document.getElementById('box').innerHTML=h;
  document.querySelectorAll('.nav button').forEach(b=>{
    b.classList.toggle('activo', String(DATA.dias)===b.getAttribute('data-d'));
  });
}

}
